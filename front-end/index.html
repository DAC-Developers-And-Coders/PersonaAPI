<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/png" href="./images/Phantom_Thieves_Logo.png">
    <title>Persona Manager</title>
</head>
<body>
    <header>
        <h1><a href="index.html">Persona Manager</a></h1>
        <nav class="nav-header">
            <ul class="nav-header-menu">
                <li><a href="#Personas">Personas</a></li>
                <li><a href="#Elementos">Elementos</a></li>
                <li><a href="#Arcanas">Arcanas</a></li>
            </ul>
        </nav>
    </header>

    <section id="Personas">
        <div class="form-persona">
            <div class="cadaster-persona">
                <h1>Cadastro de Persona</h1>
                <form>
                    <input type="text" name="name" placeholder="Nome do Persona">
                    <input type="text" name="origem" placeholder="Origem do Persona">
                    <input type="text" name="primeira_aparicao" placeholder="Primeira Aparição do Persona">
                    <input type="text" name="classe" placeholder="Classe do Persona">
                    <input type="number" name="nivel_inicial" placeholder="Nível Inicial do Persona">
                    <input type="number" name="arcana_id" placeholder="Arcana do Persona">
                    <input type="number" name="elemento_id" placeholder="Elemento do Persona">
                    <button type="submit">Cadastrar Persona</button>
                </form>
            </div>
            <div class="search-persona">
                <h1>Buscar Persona</h1>
                <form>
                    <input type="number" name="id_persona" placeholder="ID do Persona">
                    <button type="submit">Buscar Persona</button>
                </form>
            </div>
            <div class="delete-persona">
                <h1>Deletar Persona</h1>
                <form>
                    <input type="number" name="id_persona" placeholder="ID do Persona">
                    <button type="submit">Deletar Persona</button>
                </form>
            </div>
        </div>
        <div class="result-persona">

        </div>
    </section>

    <section id="Elementos">
        <div class="search-elemento">
            <h1>Buscar Elemento</h1>
            <form>
                <input type="number" name="id_elemento" placeholder="ID do Elemento">
                <button type="submit">Buscar Elemento</button>
            </form>
        </div>

        <div class="result-elemento">

        </div>
    </section>
    
    <section id="Arcanas">
        <div class="search-arcano">
            <h1>Buscar Arcana</h1>
            <form>
                <input type="number" name="id_arcano" placeholder="ID do Arcana">
                <button type="submit">Buscar Arcana</button>
            </form>
        </div>

        <div class="result-arcano">

        </div>
    </section>
</body>
</html>
